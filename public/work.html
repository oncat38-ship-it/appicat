<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="AIと一緒に、便利をつくる。"><title>仕事｜AppiCat</title><style>
:root{--ink:#30364b;--muted:#7b8298;--line:#e9e9f3;--bg:#f8f8fc;--lav:#eeeaff;--blue:#e8f3ff;--pink:#fff0f5;--mint:#e9f8f3;--shadow:0 12px 32px #4b477510}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif;line-height:1.65}a{color:inherit;text-decoration:none}.wrap{width:min(980px,calc(100% - 36px));margin:auto}
header{height:60px;position:sticky;top:0;z-index:10;background:#ffffffeb;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{height:100%;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:8px;font-size:1rem;font-weight:850;letter-spacing:-.04em}
.logo{width:29px;height:29px;border-radius:10px;background:linear-gradient(145deg,#a99df0,#7e9ee9);display:grid;place-items:center;color:white}
.links{display:flex;gap:5px}.links a{font-size:.76rem;color:#777d92;padding:7px 10px;border-radius:20px}.links a.active,.links a:hover{background:var(--lav);color:#6257b4}
.hero{padding:40px 0 24px;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;width:200px;height:200px;border-radius:50%;background:#e9e4ff;right:-45px;top:-100px}
.hero:after{content:"";position:absolute;width:82px;height:82px;border-radius:25px;background:#e2f3ff;transform:rotate(28deg);right:110px;top:42px}.hero .wrap{position:relative;z-index:1}
.eyebrow,.tiny{color:#8176c9;font-size:.66rem;font-weight:800;letter-spacing:.12em}.hero h1{font-size:clamp(1.55rem,4vw,2.2rem);line-height:1.4;letter-spacing:-.045em;margin:10px 0 8px}
.hero p,.section-head p{margin:0;color:var(--muted);font-size:.82rem}.section{padding:18px 0 56px}.section-head{margin-bottom:16px}.section-head h2{font-size:1.05rem;margin:2px 0 4px}
.searchbox{display:flex;align-items:center;gap:9px;background:white;border:1px solid var(--line);border-radius:14px;padding:0 14px;height:45px;margin:0 0 18px}.searchbox span{color:#9a96c8;font-size:1.1rem}
.searchbox input{border:0;outline:0;background:transparent;width:100%;font-size:.83rem;color:var(--ink)}
.category-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.category{display:flex;align-items:center;gap:14px;min-height:112px;padding:18px;background:white;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);transition:.2s}
.category:hover,.app:hover{transform:translateY(-3px);box-shadow:0 16px 32px #4b47751b}.cat-icon{width:48px;height:48px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:23px;background:var(--pink)}
.work .cat-icon{background:var(--blue)}.cat-copy{min-width:0;flex:1}.cat-copy b{display:block;font-size:1rem}.cat-copy small{display:block;color:var(--muted);font-size:.72rem;margin-top:3px}.go{color:#a19ad6}
.cat-hero{padding:25px 0 18px}.crumb{font-size:.72rem;color:#989caf;margin-bottom:12px}.crumb a{color:#776bc4}.cat-title{display:flex;align-items:center;gap:13px}.cat-title h1{font-size:1.45rem;margin:0}.cat-title p{font-size:.76rem;color:var(--muted);margin:2px 0 0}
.app-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.app{display:flex;align-items:center;gap:13px;background:white;border:1px solid var(--line);border-radius:17px;padding:15px;min-height:98px;box-shadow:0 5px 18px #45405e08;transition:.2s}
.app-icon{width:44px;height:44px;border-radius:14px;background:var(--lav);display:grid;place-items:center;flex:none;font-size:21px}.app:nth-child(3n+2) .app-icon{background:var(--mint)}.app:nth-child(3n) .app-icon{background:var(--blue)}
.app-info{min-width:0;flex:1}.app-info h2{font-size:.87rem;margin:0 0 3px}.app-info p{font-size:.71rem;color:var(--muted);margin:0}.tag{display:inline-block;margin-top:6px;padding:2px 8px;border-radius:20px;background:#f3f1ff;color:#7a70bd;font-size:.61rem}
.empty,.message{display:none;text-align:center;padding:28px;color:var(--muted);font-size:.82rem;background:white;border-radius:16px;border:1px dashed var(--line)}.message{display:block;margin:12px 0}
footer{border-top:1px solid var(--line);padding:20px 0 25px;color:#999db0;font-size:.68rem}.foot{display:flex;justify-content:space-between;gap:15px}.foot-links{display:flex;gap:14px}
.test{position:fixed;right:10px;top:68px;z-index:30;padding:4px 9px;background:#fff5dd;border:1px solid #f1d69b;border-radius:20px;color:#9a6a21;font-size:10px;font-weight:800}
@media(max-width:620px){.wrap{width:calc(100% - 30px)}header{height:56px}.links a{font-size:.69rem;padding:6px 8px}.hero{padding:32px 0 18px}.hero:after{right:50px;top:45px}.category-grid,.app-grid{grid-template-columns:1fr}.category{min-height:96px;padding:15px}.section{padding-top:15px}.cat-hero{padding-top:20px}.foot{flex-direction:column}}
</style></head><body>
<header><div class="wrap nav"><a class="brand" href="index.html"><span class="logo">✦</span>AppiCat</a><nav class="links"><a href="index.html">ホーム</a><a class="" href="private.html">暮らし</a><a class="active" href="work.html">仕事</a></nav></div></header>
<main><section class="cat-hero"><div class="wrap"><div class="crumb"><a href="index.html">ホーム</a>　/　<span id="crumbTitle">仕事</span></div><div class="cat-title"><span class="cat-icon" id="catIcon" style="background:#e8f3ff">▦</span><div><h1 id="pageTitle">仕事</h1><p>毎日の作業を、少しだけ軽やかに。</p></div></div></div></section>
<section class="section wrap"><div class="section-head"><div class="tiny">TOOL LIST</div><h2>アプリを探す</h2><p>キーワードを入力すると、名前や説明から絞り込めます。</p></div>
<label class="searchbox"><span>⌕</span><input id="search" type="search" placeholder="例：収支、文章、バーコード"></label><div class="app-grid" id="appGrid"></div><div class="empty" id="empty">該当するアプリはありません。別のキーワードで探してみてください。</div><p class="message" id="loadMessage">公開データを読み込んでいます…</p></section></main>
<footer><div class="wrap foot"><span>© AppiCat　AIと一緒に、便利をつくる。</span><div class="foot-links"><a href="index.html">ホーム</a><a href="#">お問い合わせ</a></div></div></footer><div class="test" id="test" hidden>TEST ENVIRONMENT</div>



<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
import{getFirestore,doc,getDoc}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBwynWXDpSe14QQ9aj7YB6r0IM-SXThpkY",authDomain:"appicat.firebaseapp.com",projectId:"appicat",storageBucket:"appicat.firebasestorage.app",messagingSenderId:"354787416430",appId:"1:354787416430:web:46e6088c1d12c64869897f",measurementId:"G-5Q2JSM7NMV"};
const db=getFirestore(initializeApp(cfg));
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const test=()=>{const e=document.getElementById("test");if(e&&(location.hostname.startsWith("test-")||location.hostname.includes("-appicat.")))e.hidden=false};
test();
async function load(){const msg=document.getElementById("loadMessage");try{const snap=await getDoc(doc(db,"siteContent","main"));if(!snap.exists()){msg.textContent="公開データがまだありません。管理画面から「公開内容を更新」してください。";return null}return snap.data()}catch(e){console.error(e);msg.textContent="公開データを読み込めませんでした。通信状況またはFirestoreの読み取りルールを確認してください。";return null}}

const data=await load();const grid=document.getElementById("appGrid"),empty=document.getElementById("empty");
if(data){document.getElementById("loadMessage").style.display="none";const cat=(data.cats||[]).find(c=>c.id==="work");if(cat){document.getElementById("pageTitle").textContent=cat.name;document.getElementById("crumbTitle").textContent=cat.name;document.title=cat.name+"｜AppiCat";}
const apps=(data.apps||[]).filter(a=>a.status==="公開中"&&a.cat==="work").sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0));
grid.innerHTML=apps.map((a,i)=>{const body=`<span class="app-icon">${a.icon||["✧","◒","✎","▤"][i%4]}</span><span class="app-info"><h2>${esc(a.name)}</h2><p>${esc(a.desc||"")}</p>${a.tag?`<span class="tag">${esc(a.tag)}</span>`:""}</span>`;const url=String(a.url||"").trim();return url.startsWith("https://")||url.startsWith("http://")?`<a class="app" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${body}</a>`:`<article class="app">${body}</article>`}).join("");
if(!apps.length){empty.style.display="block";empty.textContent="この分類には、現在公開中のアプリはありません。"}
}
const s=document.getElementById("search");s.addEventListener("input",()=>{let q=s.value.trim().toLowerCase(),n=0;document.querySelectorAll(".app").forEach(c=>{let ok=c.innerText.toLowerCase().includes(q);c.style.display=ok?"":"none";if(ok)n++});empty.style.display=n?"none":"block"});
</script>
</body></html>
