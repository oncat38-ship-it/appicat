<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AppiCat 管理画面</title>
<style>
:root{--bg:#f6f5fb;--ink:#30334a;--muted:#858ba4;--line:#e9e8f1;--v:#8175df;--soft:#f0edff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:none}.side{background:white;padding:12px;position:sticky;top:0;z-index:2;border-bottom:1px solid var(--line)}.brand{font-size:19px;font-weight:bold;margin-bottom:9px}.nav{display:flex;gap:7px;overflow:auto}.nav button{border:0;border-radius:10px;padding:12px;background:#f7f6fb;white-space:nowrap;min-height:44px}.nav .active{background:var(--soft);color:#6559c6}.main{max-width:850px;margin:auto;padding:16px 13px 45px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.top h1{font-size:22px}.user{display:flex;gap:6px}.btn{border:0;border-radius:11px;padding:11px 13px;min-height:44px;font-size:13px;font-weight:bold}.primary{background:var(--v);color:white}.soft{background:var(--soft);color:#6559c6}.panel,.stat,.item{background:white;border:1px solid var(--line);border-radius:15px;padding:14px;margin:11px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stat small,.muted,.hint{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:21px;margin-top:5px}.section{display:none}.section.show{display:block}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:12px;color:var(--muted)}.field input,.field textarea,.field select,.search{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:16px;background:white}.searchbar{display:flex;gap:8px;margin:12px 0}.searchbar input{flex:1;min-width:0}.item h3{margin:0 0 5px;font-size:15px}.item p{font-size:13px;color:var(--muted);margin:0 0 10px}.meta{font-size:12px;color:var(--muted);margin-bottom:10px}.status{padding:4px 8px;border-radius:20px;background:#fff3df}.live{background:#e3f7ef;color:#328b70}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{border:0;border-radius:9px;padding:9px 12px;background:var(--soft);color:#6559c6;min-height:38px}.save{padding:10px;background:#faf9fd;border-radius:9px;font-size:12px;color:var(--muted);line-height:1.6}.back{display:none;position:fixed;inset:0;background:#25243b77;z-index:5;align-items:flex-end}.back.show{display:flex}.modal{background:white;width:100%;max-width:540px;margin:auto auto 0;border-radius:20px 20px 0 0;padding:20px 17px calc(18px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.foot{display:flex;gap:8px}.foot button{flex:1}#authGate{min-height:100vh;display:grid;place-items:center;padding:20px}.auth{background:white;border-radius:18px;padding:24px;width:min(420px,100%)}#authMessage{color:#b55;font-size:12px}
@media(min-width:760px){.layout{display:none;grid-template-columns:210px 1fr;min-height:100vh}.side{height:100vh;border-right:1px solid var(--line);border-bottom:0}.nav{display:grid}.nav button{text-align:left}.main{padding:28px}.back{align-items:center}.modal{border-radius:18px;margin:auto}}
@media(max-width:500px){.top{align-items:flex-start}.top h1{font-size:20px}.user{flex-direction:column}.user button{font-size:11px;padding:8px}.stats{gap:5px}.stat{padding:10px}.stat strong{font-size:18px}.searchbar{flex-direction:column}}
</style></head><body>
<div id="authGate"><div class="auth"><h2>🐾 AppiCat 管理者ログイン</h2><p class="muted">管理者Googleアカウントでログインしてください。</p><button class="btn primary" id="login" style="width:100%">Googleアカウントでログイン</button><button class="btn soft" id="diagnose" style="width:100%;margin-top:9px">ログイン接続を診断する</button><p id="authMessage"></p></div></div>
<div class="layout"><aside class="side"><div class="brand">🐾 AppiCat ADMIN</div><nav class="nav" id="nav"><button class="active" data-p="home">⌂ ホーム</button><button data-p="apps">▦ アプリ</button><button data-p="cats">◈ 分類</button><button data-p="settings">⚙ 設定</button></nav></aside><main class="main">
<header class="top"><div><small style="color:var(--v)">APPICAT / CONTROL</small><h1 id="title">ダッシュボード</h1></div><div class="user"><button class="btn primary" id="publish">公開内容を更新</button><button class="btn soft" id="logout">ログアウト</button></div></header>
<section id="home" class="section show"><p class="muted">サイトの掲載内容を管理します。</p><div class="stats"><div class="stat"><small>登録アプリ</small><strong id="na">0</strong></div><div class="stat"><small>公開中</small><strong id="nl">0</strong></div><div class="stat"><small>分類</small><strong id="nc">0</strong></div></div><div class="panel"><h3>クイック操作</h3><div class="actions"><button class="btn primary" id="quickApp">＋ アプリ登録</button><button class="btn soft" id="quickCat">＋ 分類追加</button></div><p class="save" id="homeStatus">ログイン後に保存状態を表示します。</p></div></section>
<section id="apps" class="section"><p class="muted">アプリ情報を登録・編集します。URLは https:// から入力してください。</p><div class="panel"><h3>アプリ一覧</h3><div class="searchbar"><input class="search" id="search" placeholder="名前・説明で検索"><button class="btn primary" id="addApp">＋ 新規登録</button></div><div id="appList"></div><p class="save" id="saveStatus">下書きは自動保存されます。</p></div></section>
<section id="cats" class="section"><div class="panel"><h3>分類一覧</h3><button class="btn primary" id="addCat">＋ 分類追加</button><div id="catList"></div></div></section>
<section id="settings" class="section"><div class="panel"><h3>サイト基本情報</h3><div class="field"><label>サイト名</label><input id="siteName" value="AppiCat"></div><div class="field"><label>キャッチコピー</label><input id="siteTagline" value="AIと一緒に、便利をつくる。"></div><p class="hint">入力内容は下書きに自動保存されます。</p></div></section>
</main></div>
<div class="back" id="back"><div class="modal"><h3 id="mt"></h3><div id="mb"></div><div class="foot"><button class="btn soft" id="cancel">キャンセル</button><button class="btn primary" id="save">保存する</button></div></div></div>
<script>
(()=>{const $=x=>document.getElementById(x),s={cats:[{id:"private",name:"プライベート",parent:""},{id:"work",name:"仕事",parent:""}],apps:[{id:"a1",name:"収支管理ツール",desc:"日々のお金の出入りを記録",cat:"private",status:"準備中",order:1,url:""},{id:"a2",name:"小説執筆ツール",desc:"作品や設定をまとめて執筆",cat:"private",status:"開発中",order:2,url:""},{id:"a3",name:"JAN補助ツール",desc:"商品コード確認を補助",cat:"work",status:"開発中",order:3,url:""}]};let fn=null;
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const cn=id=>s.cats.find(c=>c.id===id)?.name||"未分類";
function render(){$("na").textContent=s.apps.length+"件";$("nl").textContent=s.apps.filter(a=>a.status==="公開中").length+"件";$("nc").textContent=s.cats.length+"件";let q=$("search").value.toLowerCase();$("appList").innerHTML=s.apps.filter(a=>(a.name+a.desc).toLowerCase().includes(q)).map(a=>`<article class="item"><h3>${esc(a.name)}</h3><p>${esc(a.desc)}</p><div class="meta">${esc(cn(a.cat))} ・ <span class="status ${a.status==="公開中"?"live":""}">${esc(a.status)}</span> ・順 ${a.order}</div><div class="meta">${a.url?"リンク設定済み":"リンク未設定"}</div><div class="actions"><button data-edit="${a.id}">編集</button><button data-toggle="${a.id}">公開切替</button></div></article>`).join("")||"<p class=muted>該当なし</p>";$("catList").innerHTML=s.cats.map(c=>`<article class=item><b>${esc(c.name)}</b><p class=muted>${c.parent?"小分類":"大分類"} ・ ${s.apps.filter(a=>a.cat===c.id).length}件</p><button class=soft data-cat="${c.id}">編集</button></article>`).join("");if(window.dbReady)window.dispatchEvent(new Event("changed"))}
function page(id){document.querySelectorAll(".section").forEach(x=>x.classList.toggle("show",x.id===id));document.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("active",x.dataset.p===id));$("title").textContent=({home:"ダッシュボード",apps:"アプリ管理",cats:"分類管理",settings:"基本設定"})[id]}
function modal(t,b,f){$("mt").textContent=t;$("mb").innerHTML=b;fn=f;$("back").classList.add("show")}function close(){$("back").classList.remove("show");fn=null}
function appForm(a){let opts=s.cats.map(c=>`<option value="${esc(c.id)}" ${a?.cat===c.id?"selected":""}>${esc(c.name)}</option>`).join("");modal(a?"アプリ編集":"アプリ登録",`<div class=field><label>アプリ名</label><input id=fname value="${esc(a?.name||"")}"></div><div class=field><label>説明</label><textarea id=fdesc rows=3>${esc(a?.desc||"")}</textarea></div><div class=field><label>アプリのURL（https://〜）</label><input id=furl type=url inputmode=url placeholder="https://example.com" value="${esc(a?.url||"")}"></div><div class=field><label>分類</label><select id=fcat>${opts}</select></div><div class=field><label>表示順</label><input id=forder type=number value="${a?.order??s.apps.length+1}"></div><div class=field><label>公開状態</label><select id=fstatus>${["準備中","開発中","公開中"].map(v=>`<option ${a?.status===v?"selected":""}>${v}</option>`).join("")}</select></div>`,()=>{let n=$("fname").value.trim(),url=$("furl").value.trim();if(!n){alert("アプリ名を入力してください");return}if(url&&!/^https?:\/\//i.test(url)){alert("URLは https:// または http:// から入力してください");return}let v={id:a?.id||"app"+Date.now(),name:n,desc:$("fdesc").value,cat:$("fcat").value,order:+$("forder").value||1,status:$("fstatus").value,url};s.apps=a?s.apps.map(x=>x.id===a.id?v:x):[...s.apps,v];close();render()})}
function catForm(c){modal(c?"分類編集":"分類追加",`<div class=field><label>分類名</label><input id=cname value="${esc(c?.name||"")}"></div><p class=hint>現在の公開ページは「private」「work」の2分類に対応しています。新しい分類ページは別途追加が必要です。</p>`,()=>{let n=$("cname").value.trim();if(!n){alert("分類名を入力してください");return}if(c)s.cats.find(x=>x.id===c.id).name=n;else s.cats.push({id:"cat"+Date.now(),name:n,parent:""});close();render()})}
$("nav").onclick=e=>{let b=e.target.closest("[data-p]");if(b)page(b.dataset.p)};$("quickApp").onclick=$("addApp").onclick=()=>appForm();$("quickCat").onclick=$("addCat").onclick=()=>catForm();$("search").oninput=render;$("cancel").onclick=close;$("save").onclick=()=>fn?.();$("back").onclick=e=>{if(e.target===$("back"))close()};document.addEventListener("click",e=>{let a=e.target.closest("[data-edit]"),t=e.target.closest("[data-toggle]"),c=e.target.closest("[data-cat]");if(a)appForm(s.apps.find(x=>x.id===a.dataset.edit));if(t){let x=s.apps.find(x=>x.id===t.dataset.toggle);x.status=x.status==="公開中"?"準備中":"公開中";render()}if(c)catForm(s.cats.find(x=>x.id===c.dataset.cat))});
window.getAppiCatData=()=>({apps:s.apps,cats:s.cats,siteName:$("siteName").value,siteTagline:$("siteTagline").value});window.loadAppiCatData=d=>{if(Array.isArray(d.apps))s.apps=d.apps;if(Array.isArray(d.cats))s.cats=d.cats;if(d.siteName)$("siteName").value=d.siteName;if(d.siteTagline)$("siteTagline").value=d.siteTagline;render()};render()})();
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";import{getAuth,GoogleAuthProvider,onAuthStateChanged,signInWithPopup,signOut}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";import{getFirestore,doc,getDoc,setDoc,addDoc,collection,serverTimestamp}from"https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBwynWXDpSe14QQ9aj7YB6r0IM-SXThpk",authDomain:"appicat.firebaseapp.com",projectId:"appicat",storageBucket:"appicat.firebasestorage.app",messagingSenderId:"354787416430",appId:"1:354787416430:web:46e6088c1d12c64869897f",measurementId:"G-5Q2JSM7NMV"},ADMIN="WqB04ZUMt2WxZPXpoc4PCxkgbav2",app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);
let ready=false,timer=null,saveChain=Promise.resolve(),revision=0,savedRevision=0;
function status(t){$("saveStatus").textContent=t;$("homeStatus").textContent=t}
async function saveDraftNow(){if(!ready)return;const rev=revision;const payload={...window.getAppiCatData(),updatedAt:serverTimestamp()};saveChain=saveChain.then(()=>setDoc(doc(db,"siteDrafts","main"),payload));try{await saveChain;savedRevision=Math.max(savedRevision,rev);status("✓ 下書きを保存しました")}catch(e){console.error(e);status("保存失敗：Firestoreのルール・通信を確認してください");throw e}}
function queue(){if(!ready)return;revision++;clearTimeout(timer);status("変更あり・保存待ち…");timer=setTimeout(()=>saveDraftNow().catch(()=>{}),700)}
async function flushDraft(){clearTimeout(timer);timer=null;if(savedRevision<revision)await saveDraftNow();await saveChain}
async function publish(){if(!ready||!confirm("現在の下書きを公開データに反映しますか？"))return;let b=$("publish");b.disabled=true;try{await flushDraft();const d=window.getAppiCatData(),p={apps:d.apps.filter(x=>x.status==="公開中"),cats:d.cats,siteName:d.siteName,siteTagline:d.siteTagline,publishedAt:serverTimestamp()};await setDoc(doc(db,"siteContent","main"),p);await addDoc(collection(db,"contentHistory"),{action:"publish",summary:"公開内容を更新",appCount:p.apps.length,categoryCount:p.cats.length,createdAt:serverTimestamp()});status("✓ 公開データと履歴を保存しました。公開ページに反映されます。");alert("公開データを更新しました。公開ページを確認してください。")}catch(e){console.error(e);status("公開失敗：Firestoreのルール・通信を確認してください");alert("公開に失敗しました。Firestoreのルールと通信を確認してください。")}finally{b.disabled=false}}
window.addEventListener("changed",queue);$("siteName").oninput=queue;$("siteTagline").oninput=queue;$("publish").onclick=publish;
onAuthStateChanged(auth,async u=>{if(!u){ready=false;window.dbReady=false;$("authGate").style.display="grid";document.querySelector(".layout").style.display="none";return}if(u.uid!==ADMIN){await signOut(auth);$("authMessage").textContent="このアカウントには管理権限がありません";return}$("authGate").style.display="none";document.querySelector(".layout").style.display=window.innerWidth>=760?"grid":"block";window.addEventListener("resize",()=>document.querySelector(".layout").style.display=window.innerWidth>=760?"grid":"block");try{let d=await getDoc(doc(db,"siteDrafts","main"));if(d.exists())window.loadAppiCatData(d.data());ready=true;window.dbReady=true;status(d.exists()?"✓ 保存済み下書きを読み込みました":"初期データです。編集すると自動保存されます")}catch(e){console.error(e);status("読み込み失敗：Firestoreの設定を確認してください")}});
$("diagnose").onclick=async()=>{const out=$("authMessage");const b=$("diagnose");b.disabled=true;out.textContent="診断中です…";const key=cfg.apiKey;try{const r=await fetch("https://identitytoolkit.googleapis.com/v1/accounts:createAuthUri?key="+encodeURIComponent(key),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identifier:"diagnostic@appicat.invalid",continueUri:location.origin,providerId:"google.com"})});let data={};try{data=await r.json()}catch{};console.log("AppiCat Firebase diagnostic",{origin:location.origin,projectId:cfg.projectId,authDomain:cfg.authDomain,apiKeyPrefix:key.slice(0,8),httpStatus:r.status,response:data});if(r.ok){out.textContent="診断結果：FirebaseはAPIキーを受け付けています（HTTP "+r.status+"）。この状態でログインだけ失敗する場合は、認証画面への遷移・許可ドメイン等を追加調査します。"}else{out.textContent="診断結果：Firebase APIがエラーを返しました（HTTP "+r.status+"）。"+(data.error?.message||JSON.stringify(data))+"。画面のこの結果をそのまま送ってください。"}}catch(e){console.error("AppiCat diagnostic network error",e);out.textContent="診断通信に失敗しました："+(e.message||String(e))+"。通信環境またはブラウザ側の制限を確認します。"}finally{b.disabled=false}};$("login").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){console.error("AppiCat login error:",e);$("authMessage").textContent="ログイン失敗："+(e.code||"コード不明")+" / "+(e.message||"詳細なし")}};$("logout").onclick=()=>signOut(auth);
</script></body></html>
